//An example configuration file for log system
log_cfg =
{
	//LOG_LVL_ASSERT:0;LOG_LVL_ERROR:3;LOG_LVL_WARNING:4;LOG_LVL_INFO:6;LOG_LVL_DBG:7;
	global_log_level = 0;	
	console_backend_cfg = {
		status 			= "enable";		//enable,other string will disable		
	};
	file_backend_cfg = {
		status		  = "enable";		//enable,other string will disable
		log_file_name = "/etc/ulog/lidar/ulog.log";  //can set to /tmp/echiev.log,will print to ram
		log_file_max_size = 0xa00000;	//default max file size is 10MByte. 10MB:0xA00000;20MB:0x1400000;50MB:0x3200000;100MB:0x6400000
		log_file_max_rotage = 10;		//default max rotate num is 10.			
		log_file_buffer_size = 0x200000; //file log buffer,default is 2Mbyte.
		log_file_flush_interval = 2;	//flush to filesystem every 2 seconds.
	};
	global_filter_tag = "";			//global filter tag
	global_filter_keyword = "";	//global filter keyword
	tag_filter_cfg = (
		{
			tag = "ecv.lidar.example";		//set filter level for "ecv.pln.example" module
			log_level = 0;
		},
		{
			tag = "ecv.lidar.kernel";			//set filter level for "ecv.pln.kernel" module
			log_level = 0;
		}
	);
};
